# Built-in profiles. A profile lists artifacts for all platforms; only the
# artifacts that apply to the host platform are collected. Artifact order
# defines collection order (and therefore what is kept first when a size or
# time limit is reached).
profiles:
  - name: minimal
    description: Smallest and fastest profile with key system artifacts (registry hives, event logs, execution evidence, persistence, auth logs, shell history).
    artifacts:
      # Windows
      - windows.registry.system
      - windows.registry.user
      - windows.registry.amcache
      - windows.prefetch
      - windows.eventlogs
      - windows.scheduled_tasks
      - windows.startup_folders
      - windows.powershell_history
      # Linux
      - linux.accounts
      - linux.logs.auth
      - linux.persistence.cron
      - linux.persistence.systemd
      - linux.persistence.init
      - linux.persistence.package_hooks
      - linux.system_info
      # Linux and macOS
      - unix.shell_history
      - unix.ssh
      # macOS
      - macos.system_info
      - macos.persistence
      - macos.logs

  - name: standard
    description: Default incident response triage. Adds file system metadata (NTFS $MFT, $LogFile, $UsnJrnl), SRUM, WMI, user activity, browsers, RMM/AV/server logs, more persistence locations, full /var/log, systemd journal and macOS unified logs.
    include: [minimal]
    artifacts:
      - windows.ntfs.mft
      - windows.ntfs.usnjrnl
      - windows.ntfs.logfile
      - windows.srum
      - windows.pca
      - windows.wmi_repository
      - windows.group_policy
      - windows.recent_files
      - windows.activities_cache
      - windows.notifications
      - windows.webcache
      - windows.recycle_bin
      - windows.setupapi_logs
      - windows.hosts
      - windows.firewall_logs
      - windows.bits
      - windows.user_access_logging
      - windows.defender
      - windows.ssh
      - windows.remote_access_tools
      - windows.rmm.*
      - windows.av.*
      - windows.powershell.transcripts
      - windows.powershell.profiles
      - windows.wer
      - windows.cryptnet_url_cache
      - windows.lateral.impacket
      - windows.appcompat.custom_shims
      - windows.office.persistence
      - windows.rdp_client_files
      - windows.vpn_clients
      - windows.network_scanners
      - windows.capability_access
      - windows.startupinfo
      - windows.logs.debug
      - windows.notepad
      - windows.ad.sysvol
      - windows.iis.config
      - windows.exchange.webshells
      - windows.mssql.errorlog
      - windows.dhcp_server
      - windows.backup.veeam
      - windows.web.tomcat
      - linux.live.kernel
      - linux.accounts.shadow
      - linux.persistence.pam_modules
      - linux.persistence.boot
      - linux.persistence.network_hooks
      - linux.persistence.dbus_polkit
      - linux.persistence.python_hooks
      - linux.persistence.systemd_vendor
      - linux.security_config
      - linux.cloud_agents
      - linux.containers.config
      - linux.web_server_config
      - linux.web.app_config
      - linux.network_config
      - linux.directory_services
      - linux.remote_access_tools
      - linux.desktop.user_activity
      - linux.mail.spool
      - linux.logs.var_log
      - linux.logs.apps
      - linux.appliance.vcenter
      - linux.packages
      - linux.packages.dpkg_info
      - linux.locate_db
      - unix.shell_config
      - macos.accounts
      - macos.gatekeeper
      - macos.xprotect
      - macos.persistence.auth
      - macos.persistence.user_apps
      - macos.persistence.plugins
      - macos.privileged_helpers
      - macos.extensions
      - macos.managed_config
      - macos.login_records
      - macos.terminal_state
      - macos.coreanalytics
      - macos.network_usage
      - macos.remote_access_tools
      - macos.biome
      - macos.spotlight_shortcuts
      - macos.devices
      - macos.app_inventory
      - macos.preferences
      - macos.unified_logs
      - macos.fsevents
      - macos.quarantine_events
      - macos.knowledgec
      - macos.tcc
      - macos.install_history
      - macos.recent_items
      - browser.*
      # Large logs last, so that a size or time limit cuts them first.
      - linux.logs.journal

  - name: full
    description: Every built-in artifact for the platform, including large ones (systemd journal, RPM database, IIS and Exchange logs, ETL traces, staging folders, Windows.old, thumbnail and RDP caches, all Biome streams, PowerLog, all application logs).
    include: [standard]
    artifacts:
      - '*'
