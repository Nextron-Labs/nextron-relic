# Example: the configuration the Management Center generates for one Windows
# asset of a native Artefact Collection task. Nobody edits this file: the
# collection dialogue produces it, and it is stored with the evidence. See
# docs/management-center-integration.md.
#
# The fixed output name lets the agent reference the archive; the archive only
# appears under that name once it is complete. The task's work directory is
# excluded, so that a wide custom pattern never collects the archive itself.
version: 1
job:
  id: mc-task-18342
  name: Ransomware triage HR
  labels:
    case: IR-2026-0042
    requested_by: mwagner
    template: standard-triage
collect:
  profile: standard
  artifacts:
    - windows.rdp_bitmap_cache
  exclude_artifacts:
    - browser.brave
  custom_artifacts:
    - name: custom.ransom_notes
      description: Ransom notes on the desktop and in public folders
      category: custom
      sources:
        - os: [windows]
          paths:
            - '%UserHome%\Desktop\*{README,DECRYPT,RECOVER}*.{txt,html,hta}'
            - '%SystemDrive%\Users\Public\*{README,DECRYPT,RECOVER}*.{txt,html,hta}'
  # A literal '%' is written as '%%' (event log file names contain %4).
  exclude_paths:
    - 'C:\ProgramData\Nextron\Relic\mc-task-18342\**'
    - '%SystemRoot%\System32\winevt\Logs\Microsoft-Windows-Diagnostics-Performance%%4Operational.evtx'
  hashes: [md5, sha1, sha256]
limits:
  max_file_size: 2GiB
  max_total_size: 16GiB
  max_duration: 2h
  min_free_space: 5GiB
  priority: low
output:
  path: 'C:\ProgramData\Nextron\Relic\mc-task-18342\relic.zip'
  overwrite: true
