name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so that a release is only built after the full
  # test matrix passed on the tagged commit.
  workflow_call:
    inputs:
      skip-smoke:
        description: Skip the smoke test of the CI binaries (release.yml tests its own build).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Windows runners are elevated: the live raw NTFS tests read $MFT,
      # $UsnJrnl:$J and the locked SYSTEM hive of the runner.
      - name: Test
        run: go test -v ./...
      # Linux tests again as root (O_NOATIME, unreadable files, all homes).
      - name: Test as root
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" go test ./...

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go toolchain
        run: make check-go
      - run: make vet dist
      - uses: actions/upload-artifact@v7
        with:
          name: relic-binaries
          path: dist/
          if-no-files-found: error

  # Runs the cross-compiled binaries on Linux, Windows and macOS runners.
  smoke:
    needs: dist
    if: ${{ !inputs.skip-smoke }}
    uses: ./.github/workflows/smoke.yml
    with:
      artifact: relic-binaries
